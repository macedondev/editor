name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test-stable:
    name: Test on stable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Version channel check
        if: github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'dev')
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -q '^pubspec.yaml$'; then
            version=$(awk '/^version:/ {print $2}' pubspec.yaml)
            if [ "${{ github.base_ref }}" = "main" ]; then
              if echo "$version" | grep -q '-'; then
                echo "Main requires a stable version (no pre-release suffix)."
                exit 1
              fi
            else
              if ! echo "$version" | grep -q '-'; then
                echo "Dev requires a pre-release version suffix (e.g. -dev.1)."
                exit 1
              fi
            fi
          else
            echo "pubspec.yaml not changed; skipping version channel check."
          fi
      - name: Install dependencies
        run: dart pub get
      - name: Test release tag retry logic
        run: bash .github/scripts/check-release-tag.sh --self-test
      - name: Validate AI extensions
        run: dart run tool/validate_ai_extensions.dart
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Test Web overlay pre-layout safety
        run: >-
          flutter test --platform chrome
          test/widgets/monaco_overlay_boundary_web_test.dart

  test-beta:
    name: Test on beta
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: beta
      - name: Install dependencies
        run: dart pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  bridge-js:
    name: Bridge JS syntax + semantics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: node --check every bridge script
        run: find assets/monaco/bridge -name '*.js' -print -exec node --check {} +
      - name: Execute the real bridge against the Monaco stub
        run: node --test tool/bridge_tests/*_test.mjs

  pana:
    name: Pana
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: dart pub get
      - name: Add pub cache to PATH
        run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Install pana
        run: dart pub global activate pana 0.23.14
      - name: Run pana
        run: pana --exit-code-threshold 0 .
